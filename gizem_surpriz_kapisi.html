<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#160f25">
<title>Gizem'e Bir Sürpriz ✨</title>
<style>
  :root { --gold:#f5d79a; --pink:#ffb6cb; --deep:#160f25; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100svh; overflow:hidden; color:#fff;
    font-family: Georgia, "Times New Roman", serif;
    background: radial-gradient(ellipse at 50% 45%, #49305b 0%, #24182f 42%, #100c19 100%);
    display:grid; place-items:center;
  }
  .stars, .stars:before, .stars:after {
    position:absolute; inset:0; pointer-events:none; content:"";
    background-image: radial-gradient(2px 2px at 15% 22%,#fff 98%,transparent),
      radial-gradient(1.5px 1.5px at 77% 18%,#f8d9a5 98%,transparent),
      radial-gradient(2px 2px at 84% 72%,#fff 98%,transparent),
      radial-gradient(1px 1px at 24% 78%,#ffd5e1 98%,transparent),
      radial-gradient(1.5px 1.5px at 65% 87%,#fff 98%,transparent),
      radial-gradient(1px 1px at 43% 12%,#fff 98%,transparent);
    opacity:.8; animation: twinkle 4s ease-in-out infinite alternate;
  }
  .stars:before { transform:translate(20px,12px); opacity:.45; }
  @keyframes twinkle { from{opacity:.35} to{opacity:.9} }
  .scene { position:relative; z-index:1; width:min(92vw,520px); text-align:center; padding:20px 0; }
  .eyebrow { color:var(--gold); letter-spacing:.22em; text-transform:uppercase; font: 11px/1.5 Arial,sans-serif; margin-bottom:14px; }
  h1 { font-size:clamp(26px,6vw,39px); font-weight:normal; margin:0 0 10px; text-shadow:0 2px 18px #0007; }
  .sub { color:#e8ddeb; font:14px/1.6 Arial,sans-serif; margin:0 auto 24px; max-width:300px; }
  .door-stage { perspective:1200px; width:min(72vw,300px); height:min(48vh,390px); min-height:270px; margin:0 auto; position:relative; }
  .glow {
    position:absolute; inset:8% -13%; border-radius:50%;
    background:radial-gradient(ellipse, #ffd89a7a 0%, #ffb6cb30 42%, transparent 72%);
    filter:blur(18px); opacity:.15; transition:opacity 1s ease;
  }
  .inner-photo {
    position:absolute; inset:8px; overflow:hidden; border:5px solid #b98751;
    border-radius:5px; background:#1b1322; box-shadow:0 0 0 3px #f1d4a5, 0 0 50px #ffc87b55;
  }
  .inner-photo img { width:100%; height:100%; object-fit:cover; object-position:center 35%; display:block; }
  .inner-photo:after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,transparent 60%,#1a1028aa); }
  .door {
    position:absolute; inset:0; display:flex; transform-style:preserve-3d; z-index:3;
    filter:drop-shadow(0 14px 20px #0008);
  }
  .leaf {
    width:50%; height:100%; position:relative; transform-style:preserve-3d;
    transition:transform 1.65s cubic-bezier(.2,.75,.15,1);
    background:linear-gradient(90deg,#3e1e35,#6c3548 18%,#4c243a 48%,#29172c);
    border:5px solid #d2a56a;
  }
  .leaf.left { transform-origin:left center; border-right:2px solid #e6c18a; }
  .leaf.right { transform-origin:right center; border-left:2px solid #e6c18a; }
  .leaf:before {
    content:""; position:absolute; inset:12px; border:2px solid #c99b62;
    box-shadow:inset 0 0 0 5px #3b1d34, inset 0 0 0 7px #a87550;
  }
  .panel { position:absolute; left:18%; right:18%; top:14%; height:30%; border:2px solid #bd8b57; border-radius:3px; }
  .panel.bottom { top:50%; height:35%; }
  .knob { position:absolute; top:49%; width:11px; height:11px; border-radius:50%; background:radial-gradient(circle at 30% 25%,#fff2c7,#c48b39 65%,#744321); box-shadow:0 0 7px #ffd88b; }
  .left .knob { right:7px; } .right .knob { left:7px; }
  .door-sign {
    position:absolute; z-index:4; top:42%; left:50%; transform:translate(-50%,-50%);
    width:75%; padding:12px 7px; color:#ffe8bb; background:#2a172de8; border:1px solid #e5bd7e;
    box-shadow:0 0 20px #0005; font:12px Arial,sans-serif; letter-spacing:.06em;
    transition:opacity .35s ease;
  }
  .door-sign span { display:block; font-size:23px; margin-bottom:5px; }
  .open .leaf.left { transform:rotateY(-112deg); }
  .open .leaf.right { transform:rotateY(112deg); }
  .open .door-sign { opacity:0; }
  .open .glow { opacity:1; }
  .instruction { margin:20px 0 0; font:12px Arial,sans-serif; color:#e9d9ed; letter-spacing:.06em; animation:pulse 1.8s infinite; }
  @keyframes pulse { 50%{opacity:.55} }
  .message { opacity:0; transform:translateY(14px); transition:opacity .9s ease .7s, transform .9s ease .7s; margin-top:18px; pointer-events:none; }
  .open .message { opacity:1; transform:translateY(0); }
  .message h2 { font-size:clamp(28px,7vw,42px); font-weight:normal; color:#ffe0a7; margin:0 0 7px; text-shadow:0 0 22px #ffcb8a66; }
  .message p { margin:0; color:#f7eaf5; font:14px/1.7 Arial,sans-serif; }
  .replay { margin-top:14px; opacity:0; pointer-events:none; border:1px solid #e7c68e; border-radius:30px; padding:10px 18px; color:#ffe8bb; background:#ffffff0b; cursor:pointer; font:12px Arial,sans-serif; transition:opacity .4s; }
  .open .replay { opacity:1; pointer-events:auto; }
  .sparkle { position:fixed; z-index:5; pointer-events:none; animation:burst 2.7s ease-out forwards; font-size:20px; }
  @keyframes burst { 0%{transform:translate(0,0) scale(.4) rotate(0);opacity:0} 12%{opacity:1} 100%{transform:translate(var(--x),var(--y)) scale(1.2) rotate(180deg);opacity:0} }
  .footer { position:fixed; bottom:13px; left:0; right:0; text-align:center; color:#bca9c6; font:10px Arial,sans-serif; letter-spacing:.12em; }
  @media (max-height:700px) { .eyebrow{margin-bottom:7px} .sub{margin-bottom:12px} .door-stage{height:44vh;min-height:230px} .instruction{margin-top:12px} .message{margin-top:10px} }
  @media (prefers-reduced-motion: reduce) { *,*:before,*:after{animation-duration:.01ms!important; transition-duration:.01ms!important;} }
</style>
</head>

      s.style.setProperty('--y',(-40-Math.random()*180)+'px');
      s.style.color=['#ffe0a7','#ffb6cb','#fff3d6','#d7c4ff'][Math.floor(Math.random()*4)];
      s.style.animationDelay=(Math.random()*.5)+'s';
      document.body.appendChild(s);
      setTimeout(()=>s.remove(),3300);
    }
  }
  function toggleDoor() {
    opened=!opened;
    scene.classList.toggle('open',opened);
    instruction.textContent=opened?'SÜRPRİZ SENİN ♡':'KAPIYA TIKLA ✨';
    if(opened) confetti();
  }
  stage.addEventListener('click',toggleDoor);
  stage.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleDoor();}});
  replay.addEventListener('click',()=>{ if(opened) toggleDoor(); });
</script>
</body>
</html>
